<div [attr.inert]="disabled ? '' : null" [attr.aria-disabled]="disabled" role="group" [attr.aria-label]="label">
      <div class="mc-modebar"><div class="mc-mode-group" role="group" aria-label="Режим редактирования"><button type="button" (click)="setEditorMode('wysiwyg')" [class.active]="editorMode === 'wysiwyg'" [disabled]="!editorReady || hasMath" [attr.aria-pressed]="editorMode === 'wysiwyg'"><mat-icon>edit</mat-icon> Визуально</button><button type="button" (click)="setEditorMode('markdown')" [class.active]="editorMode === 'markdown'" [disabled]="!editorReady" [attr.aria-pressed]="editorMode === 'markdown'"><mat-icon>code</mat-icon> Markdown</button></div><div class="mc-mode-group mc-view-group" role="group" aria-label="Вид редактора"><button type="button" (click)="viewMode = 'edit'" [class.active]="viewMode === 'edit'" [attr.aria-pressed]="viewMode === 'edit'" title="Редактор"><mat-icon>view_agenda</mat-icon></button><button type="button" (click)="viewMode = 'split'" [class.active]="viewMode === 'split'" [attr.aria-pressed]="viewMode === 'split'" title="Редактор и результат"><mat-icon>vertical_split</mat-icon></button><button type="button" (click)="viewMode = 'preview'" [class.active]="viewMode === 'preview'" [attr.aria-pressed]="viewMode === 'preview'" title="Результат"><mat-icon>visibility</mat-icon></button></div></div>
      <p class="mc-editor-alert" *ngIf="editorError" role="alert">{{ editorError }}</p>
      <div class="mc-canvas" [class.mc-canvas-split]="viewMode === 'split'">
        <div class="mc-writing-pane" [hidden]="viewMode === 'preview'"><div class="mc-pane-title"><span>{{ editorMode === 'wysiwyg' ? 'РЕДАКТИРОВАНИЕ' : 'ИСХОДНЫЙ MARKDOWN' }}</span><button type="button" (click)="insertFormula()" [disabled]="!editorReady || disabled"><mat-icon>functions</mat-icon> Формула</button></div><div #toastHost class="mc-toast-host"></div></div>
        <div class="mc-preview-pane" [hidden]="viewMode === 'edit'"><div class="mc-pane-title"><span>ПРЕДПРОСМОТР</span><span class="mc-live"><i></i> ЖИВОЙ РЕЗУЛЬТАТ</span></div><div class="mc-preview-scroll"><markdown #renderedDocument class="mc-prose" [data]="markdownContent" katex [katexOptions]="katexOptions" (ready)="previewReadyChange.emit(true)"></markdown><div *ngIf="!hasContent" class="mc-empty-preview"><span>Аа</span><h3>Здесь появится<br>ваш результат</h3><p>Начните писать в редакторе.</p></div></div></div>
      </div>
</div>
