<h2 mat-dialog-title>Выберите дорожку субтитров</h2>
<mat-dialog-content>
  <p>У видео {{ data.youtubeId }} несколько дорожек. Выберите нужную за {{ secondsLeft }} сек.</p>
  <div class="track-list">
    <button mat-stroked-button type="button" *ngFor="let track of data.tracks" (click)="select(track.key)">
      <span>{{ track.languageName || track.languageCode }} ({{ track.languageCode }})</span>
      <small>{{ track.isAutoGenerated ? 'Автоматические' : 'Авторские' }}</small>
    </button>
  </div>
  <p class="timer-hint">Когда время истечёт, дорожка выберется автоматически.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="useAutomatic()">Выбрать автоматически</button>
</mat-dialog-actions>
