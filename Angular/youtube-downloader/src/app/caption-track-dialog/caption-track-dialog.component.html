<header class="track-dialog-header">
  <div><p>ДОСТУПНЫЕ СУБТИТРЫ</p><h2 mat-dialog-title>Выберите дорожку</h2></div>
</header>
<mat-dialog-content class="track-dialog-content">
  <p>У этого видео несколько дорожек. Выберите нужную в течение {{ secondsLeft }} сек.</p>
  <div class="track-list">
    <button mat-stroked-button type="button" *ngFor="let track of data.tracks" (click)="select(track.key)">
      <span><strong>{{ track.languageName || track.languageCode }}</strong><small>{{ track.languageCode }}</small></span>
      <em>{{ track.isAutoGenerated ? 'Автоматические' : 'Авторские' }}</em>
    </button>
  </div>
  <p class="timer-hint">Когда время истечёт, дорожка выберется автоматически.</p>
</mat-dialog-content>
<mat-dialog-actions class="track-dialog-actions">
  <button mat-button type="button" (click)="useAutomatic()">Выбрать автоматически</button>
</mat-dialog-actions>
